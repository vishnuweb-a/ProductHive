<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body  class ="text-bg-secondary p-3">
    <header class ="container d-flex  gap-4 justify-content-between p-4 bg-secondary.bg-gradient">
    <h1><strong>
      ProductHive
    </strong></h1>
    <nav >
      <ul class ="d-flex gap-5 flex-nowrap">
        <li class ="list-unstyled  ">
          <a class ="text-dark text-decoration-none list-group-item list-group-item-action hover-text-warning " href ="index.html">HOME</a>
        </li>
        <li class ="list-unstyled">
        <a class ="text-dark text-decoration-none list-group-item list-group-item-action hover-text-warning" href ="product.html">PRODUCTS</a>
        </li>
         <li class ="list-unstyled">
        <a class ="text-dark text-decoration-none list-group-item list-group-item-action hover-text-warning" href ="star-rated.html">STAR-RATED</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section id ="product_display">
      <div class = "container d-flex  flex-nowrap mt-5 gap-5 p-5 bg-secondary.bg-gradient ">
        <div class="card" style="width: 18rem;">
  <img id ="image" src="" class="card-img-top" alt="...">
  <div class="card-body">
    <h5 class="card-title"> <span id ="name"></span></h5>
   
  </div>
</div class ="container-fluid ">
<div  style ="margin-left: 50px;" class ="card-body mt-5 p-3">
   <p class ="fs-5">ID : <span id ="id"></span></p>
   <p class ="fs-5">Name : <span id ="name"></span></p>
   <p class ="fs-5">Category : <span id ="category"></span></p>
   <p class ="fs-5">Price : <span id ="price"></span></p>
   <p class ="fs-5">Rating : <span id ="rating"></span></p>
</div>
      </div>
    </section>
  </main>

   <footer >
    <p><h6>&copy; 2026 ProductHive. All rights reserved.</h6></p>
  </footer>
  

  <script>
    let url = new URL(window.location.href);
    let id =url.searchParams.get("id");

    let products_data =[
          {
      id: "1",
      name: "Ear Buds",
      category: "Electronics",
      price: "₹2999",
      rating: "4.5  ⭐⭐⭐⭐½",
      image : "./assets/earbuds.jpg"
    },
    {
      id: "2",
      name: "Visual Gadget",
      category: "Accessories",
      price: "₹1999",
      rating: "4 ⭐⭐⭐⭐☆ ",
        image : "./assets/vsl.jpg"
    },
    {
      id: "3",
      name: "Watch&Earbud",
      category: "Accessories",
      price: "₹1499",
      rating: "5  ⭐⭐⭐⭐⭐",
        image : "./assets/watch.jpg"
    },
    {
      id: "4",
      name: "HeadSet",
      category: "Audio",
      price: "₹2499",
      rating: "3.5 ⭐⭐⭐ ½",
        image : "./assets/still-life-tech-device.jpg"
    }

    ]

    let prd = products_data.find(el => el.id == id);
    console.log(prd);
    document.querySelector("#id").innerHTML =prd.id;
    document.querySelector("#name").innerHTML =prd.name;
    document.querySelector("#category").innerHTML =prd.category;
    document.querySelector("#price").innerHTML =prd.price;
    document.querySelector("#rating").innerHTML =prd.rating;
    document.querySelector("#image").src =prd.image;
    
  </script>
  
</body>
</html>
